# HaloCord's nightly: after HaloCord check passes on a push to the halocord
# branch, this builds that commit and puts it on the one pre-release tagged
# `nightly`, which the Nightly update channel follows. Its files are named
# and laid out as a numbered release's (scripts/halocord-package.py), the
# number being the newest release's, so the updater orders a nightly after
# the release it follows and before the next.
name: HaloCord Nightly

on:
  workflow_run:
    workflows: [HaloCord check]
    types: [completed]
    branches: [halocord]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # A passed check of a push, or a run started by hand on halocord.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/halocord') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # A newer push replaces a nightly still building.
    concurrency:
      group: halocord-nightly-build
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      commit: ${{ env.COMMIT }}
      stable: ${{ steps.stamp.outputs.stable }}
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT }}
      # The release this nightly follows, and when it was made.
      - id: stamp
        run: |
          stable=$(gh release view --json tagName --jq .tagName)
          build=${stable##*-halocord.}
          case $build in ''|*[!0-9]*) echo "the latest release, $stable, isn't a HaloCord release" >&2; exit 1 ;; esac
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # The MSVC CRT and Windows SDK cargo-xwin downloads.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: windows-xwin-${{ hashFiles('nix/flake.lock') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The build knows which HaloCord it is (build.rs), as a release does.
      # Wine doesn't start on the runner, so there's no Yapfast installer;
      # HaloCord's own installer comes from the release.
      - name: Build
        env:
          HALOCORD_BUILD: ${{ steps.stamp.outputs.build }}
          HALOCORD_NIGHTLY: ${{ steps.stamp.outputs.stamp }}
        run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - name: Package
        run: |
          gh release download "${{ steps.stamp.outputs.stable }}" --pattern HaloCord-Installer.exe --dir "$RUNNER_TEMP"
          python3 scripts/halocord-package.py --build "${{ steps.stamp.outputs.build }}" \
            --nightly "${{ steps.stamp.outputs.stamp }}" --tag nightly --commit "$COMMIT" \
            --installer "$RUNNER_TEMP/HaloCord-Installer.exe" --output release
      - uses: actions/upload-artifact@v4
        with:
          name: nightly
          path: release/*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: windows
    runs-on: ubuntu-latest
    # Never stopped between taking the old nightly down and putting this up.
    concurrency:
      group: halocord-nightly-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMMIT: ${{ needs.windows.outputs.commit }}
      STABLE: ${{ needs.windows.outputs.stable }}
      STAMP: ${{ needs.windows.outputs.stamp }}
    steps:
      # Only for the notes' jq program.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT }}
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          name: nightly
          path: release
      - name: Publish
        run: |
          set -o pipefail
          {
            echo "The newest HaloCord changes, built from \`halocord\` at $COMMIT. Expect some bugs."
            echo
            echo "Pick **Nightly** under Settings > Updates to get these, or **Stable** for numbered releases."
            echo
            echo "## Changes since $STABLE"
            echo
            # Names without @, so a nightly on every push pings nobody.
            gh api "repos/$GH_REPO/compare/$STABLE...$COMMIT" | jq -r -f .github/nightly-notes.jq | sed "s/ by @/ by /"
            echo "All changes: https://github.com/$GH_REPO/compare/$STABLE...$COMMIT"
          } > notes.md
          # One nightly at a time: the tag moves to this commit.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly release/* --prerelease --latest=false --target "$COMMIT" \
            --title "HaloCord nightly $STAMP (${COMMIT:0:7})" --notes-file notes.md
